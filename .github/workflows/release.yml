name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version.properties
        id: version
        run: |
          VERSION_CODE=$(grep "VERSION_CODE" version.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep "VERSION_NAME" version.properties | cut -d'=' -f2)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > keystore.jks

      - name: Build Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="v${{ steps.version.outputs.VERSION_NAME }}"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION_NAME }}"
          name: "DnDSheet v${{ steps.version.outputs.VERSION_NAME }}"
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION_CODE=${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}
          REPO=${{ github.repository }}
          NOTES=$(python3 -c "
          import json
          with open('version.json') as f:
              data = json.load(f)
          print(data.get('releaseNotes', ''))
          ")
          python3 -c "
          import json
          data = {
              'versionCode': $VERSION_CODE,
              'versionName': '$VERSION_NAME',
              'downloadUrl': 'https://github.com/$REPO/releases/download/v$VERSION_NAME/app-release.apk',
              'releaseNotes': '$NOTES'
          }
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to ${{ steps.version.outputs.VERSION_NAME }}" || echo "No changes to commit"
          git push origin master